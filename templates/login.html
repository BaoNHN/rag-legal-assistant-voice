<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Đăng nhập – RAG Legal Assistant</title>
<link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:ital,wght@0,400;0,600;1,400&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<style>
:root {
  --navy:  #0B1F3A; --navy2: #132843;
  --teal:  #0A8C7E; --teal2: #0DB4A2;
  --gold:  #E8A020; --white: #F7F9FC;
  --gray:  #8A97A8; --border:#D0D9E6;
  --red:   #D63B3B; --radius:10px;
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;font-family:'DM Sans',sans-serif;}
body{
  background:var(--navy);
  display:grid;place-items:center;min-height:100vh;
  background-image: radial-gradient(ellipse at 20% 50%, rgba(10,140,126,0.12) 0%, transparent 60%),
                    radial-gradient(ellipse at 80% 20%, rgba(232,160,32,0.06) 0%, transparent 50%);
}
.card{
  background:var(--navy2);
  border:1px solid rgba(255,255,255,0.08);
  border-radius:18px;
  padding:40px 36px;
  width:100%;max-width:400px;
  box-shadow:0 20px 60px rgba(0,0,0,0.4);
}
.logo{
  text-align:center;margin-bottom:28px;
}
.logo .icon{font-size:36px;margin-bottom:8px;}
.logo h1{
  font-family:'Crimson Pro',serif;
  font-size:24px;font-weight:600;
  color:var(--teal2);letter-spacing:.3px;
}
.logo p{font-size:13px;color:var(--gray);margin-top:4px;}

label{
  display:block;font-size:12px;font-weight:500;
  color:var(--gray);text-transform:uppercase;letter-spacing:.5px;
  margin-bottom:6px;margin-top:18px;
}
input{
  width:100%;padding:12px 14px;
  background:rgba(255,255,255,0.05);
  border:1.5px solid rgba(255,255,255,0.1);
  border-radius:8px;color:var(--white);
  font-size:14px;font-family:'DM Sans',sans-serif;
  transition:border-color .18s;
}
input:focus{outline:none;border-color:var(--teal2);background:rgba(255,255,255,0.07);}
input::placeholder{color:rgba(255,255,255,0.2);}

.btn-login{
  width:100%;margin-top:24px;
  padding:13px;background:var(--teal);
  color:var(--white);border:none;border-radius:var(--radius);
  font-size:15px;font-weight:600;font-family:'DM Sans',sans-serif;
  cursor:pointer;transition:background .18s;
}
.btn-login:hover{background:var(--teal2);}

.error-msg{
  display:none;margin-top:14px;
  background:rgba(214,59,59,0.12);
  border:1px solid rgba(214,59,59,0.3);
  color:#FF8080;border-radius:8px;
  padding:10px 14px;font-size:13px;text-align:center;
}
.hint{
  margin-top:20px;padding-top:16px;
  border-top:1px solid rgba(255,255,255,0.06);
  font-size:11.5px;color:var(--gray);text-align:center;line-height:1.7;
}
.hint strong{color:rgba(255,255,255,0.5);}

.toggle-link{
  display:block;text-align:center;margin-top:18px;
  font-size:12.5px;color:var(--teal2);cursor:pointer;
  text-decoration:none;border-bottom:1px dashed rgba(13,180,162,0.4);
  padding-bottom:1px;width:fit-content;margin-left:auto;margin-right:auto;
}
.toggle-link:hover{opacity:.8;}

.panel{display:none;}
.panel.active{display:block;}

.pw-hint{font-size:11px;color:var(--gray);margin-top:6px;line-height:1.5;}
.success-msg{
  display:none;margin-top:14px;
  background:rgba(29,155,108,0.12);
  border:1px solid rgba(29,155,108,0.3);
  color:#4DFFB4;border-radius:8px;
  padding:10px 14px;font-size:13px;text-align:center;
}
</style>
</head>
<body>
<div class="card">
  <div class="logo">
    <div class="icon">⚖️</div>
    <h1>RAG Legal Assistant</h1>
    <p>Trợ lý pháp luật AI — Luật Doanh nghiệp</p>
  </div>

  <!-- ══ LOGIN PANEL ══ -->
  <div class="panel active" id="panelLogin">
    <form id="loginForm">
      <label>Tên đăng nhập</label>
      <input type="text" id="username" placeholder="Nhập tên đăng nhập" required/>

      <label>Mật khẩu</label>
      <input type="password" id="password" placeholder="Nhập mật khẩu" required/>

      <button type="submit" class="btn-login">Đăng nhập</button>
    </form>

    <div class="error-msg" id="errMsg">❌ Sai tên đăng nhập hoặc mật khẩu</div>

    <div class="hint">
      Sinh viên thử: <strong>testStudent1 / 123456P@ss</strong><br/>
      Giảng viên thử: <strong>teacher1 / Teacher@123</strong>
    </div>

    <span class="toggle-link" onclick="showPanel('changePw')">Đổi mật khẩu</span>
  </div>

  <!-- ══ CHANGE PASSWORD PANEL ══ -->
  <div class="panel" id="panelChangePw">
    <form id="changePwForm">
      <label>Tên đăng nhập</label>
      <input type="text" id="cpUsername" placeholder="Nhập tên đăng nhập" required/>

      <label>Mật khẩu cũ</label>
      <input type="password" id="cpOldPassword" placeholder="Nhập mật khẩu cũ" required/>

      <label>Mật khẩu mới</label>
      <input type="password" id="cpNewPassword" placeholder="Nhập mật khẩu mới" required/>
      <div class="pw-hint">Tối thiểu 8 ký tự, gồm chữ hoa, chữ thường, số và ký tự đặc biệt.</div>

      <label>Xác nhận mật khẩu mới</label>
      <input type="password" id="cpConfirmPassword" placeholder="Nhập lại mật khẩu mới" required/>

      <button type="submit" class="btn-login">Đổi mật khẩu</button>
    </form>

    <div class="error-msg" id="cpErrMsg"></div>
    <div class="success-msg" id="cpSuccessMsg"></div>

    <span class="toggle-link" onclick="showPanel('login')">← Quay lại đăng nhập</span>
  </div>
</div>

<script>
function showPanel(name) {
  document.getElementById('panelLogin').classList.toggle('active', name === 'login');
  document.getElementById('panelChangePw').classList.toggle('active', name === 'changePw');
  document.getElementById('errMsg').style.display = 'none';
  document.getElementById('cpErrMsg').style.display = 'none';
  document.getElementById('cpSuccessMsg').style.display = 'none';
}

document.getElementById("loginForm").addEventListener("submit", async function(e) {
  e.preventDefault();
  const username = document.getElementById("username").value;
  const password = document.getElementById("password").value;
  const errEl = document.getElementById("errMsg");
  errEl.style.display = "none";

  try {
    const res  = await fetch("/login", {
      method: "POST",
      headers: {"Content-Type":"application/json"},
      body: JSON.stringify({ student_name: username, password })
    });
    const data = await res.json();
    if (data.status === "success") {
      window.location.href = "/";
    } else {
      errEl.textContent = data.message ? "❌ " + data.message : "❌ Sai tên đăng nhập hoặc mật khẩu";
      errEl.style.display = "block";
    }
  } catch(err) {
    errEl.textContent = "❌ Lỗi kết nối server";
    errEl.style.display = "block";
  }
});

const PASSWORD_RE = /^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[^A-Za-z0-9]).{8,}$/;

document.getElementById("changePwForm").addEventListener("submit", async function(e) {
  e.preventDefault();
  const username        = document.getElementById("cpUsername").value.trim();
  const oldPassword     = document.getElementById("cpOldPassword").value;
  const newPassword     = document.getElementById("cpNewPassword").value;
  const confirmPassword = document.getElementById("cpConfirmPassword").value;
  const errEl     = document.getElementById("cpErrMsg");
  const successEl = document.getElementById("cpSuccessMsg");
  errEl.style.display = "none";
  successEl.style.display = "none";

  if (newPassword !== confirmPassword) {
    errEl.textContent = "❌ Mật khẩu mới và xác nhận mật khẩu không khớp.";
    errEl.style.display = "block";
    return;
  }
  if (!PASSWORD_RE.test(newPassword)) {
    errEl.textContent = "❌ Mật khẩu mới cần tối thiểu 8 ký tự, gồm chữ hoa, chữ thường, số và ký tự đặc biệt.";
    errEl.style.display = "block";
    return;
  }

  try {
    const res  = await fetch("/change_password", {
      method: "POST",
      headers: {"Content-Type":"application/json"},
      body: JSON.stringify({
        username, old_password: oldPassword,
        new_password: newPassword, confirm_password: confirmPassword
      })
    });
    const data = await res.json();
    if (data.status === "ok") {
      successEl.textContent = "✅ " + data.message;
      successEl.style.display = "block";
      document.getElementById("changePwForm").reset();
    } else {
      errEl.textContent = "❌ " + (data.message || "Đổi mật khẩu thất bại.");
      errEl.style.display = "block";
    }
  } catch(err) {
    errEl.textContent = "❌ Lỗi kết nối server";
    errEl.style.display = "block";
  }
});
</script>
</body>
</html>
