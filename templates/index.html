<!DOCTYPE html>
<html lang="vi">
<head>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" crossorigin="anonymous"/>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"/>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>RAG Legal Assistant</title>
  <style>
    /* Teacher-only Import Law button */
    .btn-import-law {
      display: none;
      width: 90%;
      margin-right: 30px;
      margin-top: 8px;
      padding: 9px 10px;
      border: 1.5px solid rgb(16 15 15 / 0.5);
      background: #343541;
      color: white;
      border-radius: 8px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 500;
      text-align: center;
      transition: all .18s;
      text-decoration: none;
    }
    .btn-import-law:hover {
      background: #40414a;
      border-color: #E8A020;
    }
    .btn-import-law.visible { display: block; }

    /* Role badge in sidebar */
    .role-badge {
      display: inline-block;
      font-size: 10px;
      padding: 2px 7px;
      border-radius: 4px;
      font-weight: 600;
      margin-left: 6px;
      vertical-align: middle;
    }
    .role-badge.teacher {
      background: rgba(232,160,32,0.2);
      color: #E8A020;
    }
  </style>
</head>
<body>
<div class="layout">
  <!-- SIDEBAR -->
  <aside class="sidebar">
    <div class="sidebar-header">
      <button class="new-chat">+ New Chat</button>
      <!-- Import Law button — shown only for teachers via JS -->
      <a href="/import" class="btn-import-law" id="importLawBtn">
        📥 Import Law
      </a>
    </div>
    <div class="sidebar-chats" id="chat-list"></div>
  </aside>

  <main class="chat-container">
    <div class="header">
      Chat Assistant
      <span id="roleBadge"></span>
      <button onclick="logout()" style="float:right;background:rgba(255,255,255,0.1);border:none;color:white;padding:6px 12px;border-radius:6px;cursor:pointer;font-size:13px;">Logout</button>
    </div>
    <div class="container">
      <div id="chatbox" class="chatbox"></div>
      <div class="input-area">
        <!-- ── Voice toggle bar ── -->
        <div id="voiceBar" style="display:flex;align-items:center;gap:8px;margin-bottom:6px;padding:6px 10px;background:rgba(255,255,255,0.06);border-radius:8px;font-size:13px;color:#ccc;">
          <span style="font-size:12px;opacity:.7;">Giọng đọc:</span>
          <select id="ttsVoiceSelect" style="background:#1e1e2e;color:#ccc;border:1px solid rgba(255,255,255,0.15);border-radius:6px;padding:3px 8px;font-size:12px;">
            <option value="vi-VN-HoaiMyNeural">HoaiMy (Nữ)</option>
            <option value="vi-VN-NamMinhNeural">NamMinh (Nam)</option>
            <option value="en-US-JennyNeural">Jenny (EN)</option>
          </select>
          <label style="display:flex;align-items:center;gap:4px;font-size:12px;cursor:pointer;">
            <input type="checkbox" id="useRvcCheck" checked style="cursor:pointer;">
            Dùng RVC
          </label>
          <label style="display:flex;align-items:center;gap:4px;font-size:12px;cursor:pointer;">
            <input type="checkbox" id="autoSpeakCheck" checked style="cursor:pointer;">
            Tự phát âm
          </label>
          <span id="rvcStatus" style="margin-left:auto;font-size:11px;opacity:.6;"></span>
        </div>

        <!-- ── Main input row ── -->
        <div style="display:flex;gap:6px;align-items:center;">
          <button id="micBtn" title="Nhấn để ghi âm" onclick="toggleMic()"
            style="width:40px;height:40px;border-radius:50%;border:none;background:rgba(255,255,255,0.1);color:white;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:background .2s;">
            <span class="material-icons" style="font-size:20px;">mic</span>
          </button>
          <input id="chatInput" type="text" placeholder="Nhập câu hỏi về Luật Doanh nghiệp… hoặc nhấn mic 🎙"/>
          <button id="sendButton">
            <span class="material-icons">send</span> Gửi
          </button>
        </div>

        <!-- Recording status -->
        <div id="recordingStatus" style="display:none;font-size:12px;color:#f87171;margin-top:4px;padding-left:48px;">
          <span style="animation:blink 1s infinite">● </span>Đang ghi âm… nhấn mic lần nữa để dừng
        </div>
      </div>

      <!-- Hidden audio player for TTS/RVC playback -->
      <audio id="voicePlayer" style="display:none;" controls></audio>
    </div>
  </main>
</div>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/material-design-lite/1.3.0/material.indigo-pink.min.css"/>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/material-design-icons/3.0.1/iconfont/material-icons.css"/>
<script src="{{ url_for('static', filename='script.js') }}"></script>
<script src="{{ url_for('static', filename='voice.js') }}"></script>
<script>
// Show Import Law button and role badge if teacher
(async function() {
  try {
    const res  = await fetch("/session_info");
    const data = await res.json();
    if (data.user_type === "teacher") {
      document.getElementById("importLawBtn").classList.add("visible");
      const badge = document.getElementById("roleBadge");
      badge.innerHTML = '<span class="role-badge teacher">Giảng viên</span>';
    }
  } catch(e) {}
})();
</script>
</body>
</html>
